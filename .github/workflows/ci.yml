name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/nix-cache-action@main
      - name: Build package
        run: nix build .#
      - name: Run flake checks (pytest + mypy)
        run: nix flake check
