[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "py-tetris"
version = "1.0.0"
description = "Tetris game written in Python (pygame)"
requires-python = ">=3.10"
dependencies = [
    # upstream pygame's dist name; matches nixpkgs nixos-26.05 (pinned in the
    # flake), where python3Packages.pygame is upstream pygame, not pygame-ce
    "pygame>=2.1",
]

[project.scripts]
py-tetris = "py_tetris.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src/py_tetris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
